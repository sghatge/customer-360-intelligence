services:
  - type: web
    name: aep-lifecycle-gateway
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r gateway/requirements.txt
    startCommand: uvicorn app:app --app-dir gateway --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GATEWAY_API_KEY
        generateValue: true
      - key: GATEWAY_DATABASE_URL
        fromDatabase:
          name: aep-lifecycle-gateway-db
          property: connectionString

databases:
  - name: aep-lifecycle-gateway-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: aep_gateway
    user: aep_gateway_user
