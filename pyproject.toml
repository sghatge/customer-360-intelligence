[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aep-customer-360-lab"
version = "0.2.0"
description = "Synthetic-data learning lab for AEP customer profile and event contracts"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.22,<5", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]