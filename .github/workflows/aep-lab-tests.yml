name: AEP lab tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: pip install -e ".[dev]"
      - name: Compile application and gateway modules
        run: python -m compileall -q app.py gateway tests
      - name: Run SQLite and application tests
        run: pytest -q tests/test_gateway.py

  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gateway_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GATEWAY_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gateway_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: pip install -e ".[dev]"
      - name: Compile application and gateway modules
        run: python -m compileall -q app.py gateway tests
      - name: Run PostgreSQL integration tests
        run: pytest -q tests/test_gateway_postgres.py
